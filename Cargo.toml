[package]
name = "counterpoint"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lawful combinators for orchestrating async Rust: parallel, race, timeout, retry schedules, fallback, bounded concurrency and circuit breaking, with algebraic laws checked by property tests."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sawady/counterpoint"
readme = "README.md"
documentation = "https://docs.rs/counterpoint"
keywords = ["async", "retry", "timeout", "combinators", "resilience"]
categories = ["asynchronous", "concurrency"]
exclude = [".github/"]
authors = ["Federico Sawady"]

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }

[features]
tracing = ["dep:tracing"]

[dev-dependencies]
backon = "1.6.0"
criterion = "0.8.2"
futures = "0.3.34"
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }

[[bench]]
name = "overhead"
harness = false

[[bench]]
name = "retry_timers"
harness = false

[[bench]]
name = "footprint"
harness = false

[package.metadata.docs.rs]
all-features = true
